# Offline demo instance for README screenshots (see demo/README.md).
# Run from the repo root:  docker compose -f demo/compose.demo.yaml up -d --build
name: nzboxer-demo
services:
  nzboxer:
    build: ..
    container_name: nzboxer-demo
    ports:
      - "8002:8000"
      - "9100:9100"
    volumes:
      - ./config:/app/config
    environment:
      - TZ=UTC
      - DEMO_PUBLIC_URL=http://localhost:9100
    command:
      - sh
      - -c
      - mkdir -p /app/config/logs && chown -R appuser:appuser /app/config && exec gosu appuser python demo/run_demo.py
