<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup required – NZBoxer</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
    main { max-width: 32rem; padding: 2rem; background: #1e293b; border-radius: .75rem; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    li { margin: .25rem 0; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <main>
    <h1>Setup required</h1>
    <p>NZBoxer needs the following before it can run:</p>
    <ul>
      {% for key in setup.missing_core %}<li><a href="{{ {'tmdb': '/settings#metadata', 'indexer': '/settings#indexers', 'downloader': '/settings#downloaders'}[key] }}">{{ missing_labels[loop.index0] }}</a></li>{% endfor %}
    </ul>
    <p><a href="/settings">Open Settings</a> or use the guided setup.</p>
    <button type="button" hx-get="/onboarding/modal" hx-target="#modal-container" hx-swap="innerHTML">Start guided setup</button>
    <div id="modal-container"></div>
  </main>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</body>
</html>
