{% if state == 'running_video' %}
<div class="flex items-center gap-2 bg-[#1e1e24] border border-[#d40060]/50 rounded-full px-3 py-1 text-xs text-pink-200 shadow-sm animate-fade-in">
    <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-[#d40060]"></span>
    </span>
    <span class="font-medium">Video-Suchlauf läuft...</span>
    <button hx-post="/api/automation/abort" hx-target="#automation-nav-status" class="ml-1 px-2 py-0.5 bg-red-800 hover:bg-red-700 text-white rounded text-[10px] font-bold uppercase tracking-wider transition-colors shadow-sm cursor-pointer">
        Abbrechen
    </button>
</div>
{% elif state == 'running_print' %}
<div class="flex items-center gap-2 bg-[#1e1e24] border border-[#d40060]/50 rounded-full px-3 py-1 text-xs text-pink-200 shadow-sm animate-fade-in">
    <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-[#d40060]"></span>
    </span>
    <span class="font-medium">Print-Suchlauf läuft...</span>
    <button hx-post="/api/automation/abort" hx-target="#automation-nav-status" class="ml-1 px-2 py-0.5 bg-red-800 hover:bg-red-700 text-white rounded text-[10px] font-bold uppercase tracking-wider transition-colors shadow-sm cursor-pointer">
        Abbrechen
    </button>
</div>
{% elif state == 'aborting' %}
<div class="flex items-center gap-2 bg-[#1e1e24] border border-amber-500/50 rounded-full px-3 py-1 text-xs text-amber-300 shadow-sm animate-pulse">
    <svg class="w-3.5 h-3.5 animate-spin text-amber-400" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <span class="font-medium">Wird abgebrochen...</span>
</div>
{% endif %}
