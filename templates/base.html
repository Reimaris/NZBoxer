<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZBoxer</title>
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- AlpineJS for basic interactions like modals/tabs if needed -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            background-color: #1e1e24;
            color: #d1d5db;
        }
        .nav-link {
            transition: all 0.2s;
        }
        .nav-link:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }
        [x-cloak] { display: none !important; }
        .htmx-indicator {
            display: none !important;
        }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator {
            display: flex !important;
        }
        
        /* Remove number input spinners globally across all browsers & engines */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none !important;
            margin: 0 !important;
            display: none !important;
        }
        input[type="number"] {
            -moz-appearance: textfield !important;
            appearance: textfield !important;
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased flex flex-col">
    <!-- Top Navigation Bar -->
    <nav class="bg-[#2a2a32] border-b border-[#3f3f46] shadow-md sticky top-0 z-50">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                
                <!-- Left side: Brand -->
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2.5">
                        <a href="/" class="flex items-center gap-2.5 group">
                            <img src="/static/icon.svg" alt="NZBoxer Logo" class="w-11 h-11 shrink-0 transition-transform group-hover:scale-105">
                            <span class="text-lg font-semibold text-white tracking-wide group-hover:text-pink-400 transition-colors">NZBoxer</span>
                        </a>
                        <span class="bg-[#3f3f46] text-[#d1d5db] text-xs font-mono font-medium px-2.5 py-0.5 rounded-full mt-0.5 shadow-sm">
                            v{{ app_version }}
                        </span>
                    </div>
                </div>

                <!-- Right side: Navigation Links & Controls -->
                <div class="flex items-center gap-3 text-sm text-[#a1a1aa] font-medium">
                    <!-- 1. Clean Sync Watchlist Button -->
                    <div class="flex items-center gap-2">
                        <button hx-post="/sync" hx-target="#sync-result" class="nav-link flex items-center gap-1.5 px-3 py-1.5 bg-[#3f3f46] hover:bg-[#52525b] text-white rounded-md transition-colors text-xs font-medium">
                            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Sync Watchlist
                        </button>
                    </div>
                    
                    <!-- 2. Dashboard Link -->
                    <a href="/" class="nav-link flex items-center gap-2 ml-1">
                        <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                        Dashboard
                    </a>
                    
                    <!-- 3. Settings Link -->
                    <a href="/settings" class="nav-link flex items-center gap-2">
                        <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>
                        Settings
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Global Alerts (Sync results etc) -->
    <div id="sync-result" class="max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 mt-4 empty:hidden"></div>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Unified Push Modal & Dialog Container -->
    <div id="modal-container"></div>

</body>
</html>
