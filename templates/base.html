<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZBoxer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- AlpineJS for basic interactions like modals/tabs if needed -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            background-color: #1e1e24;
            color: #d1d5db;
        }
        .nav-link {
            transition: all 0.2s;
        }
        .nav-link:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }
        [x-cloak] { display: none !important; }
        .htmx-indicator {
            display: none !important;
        }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator {
            display: flex !important;
        }
        
        /* Hide number input spinners globally to enforce keyboard entry */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none !important;
            margin: 0 !important;
        }
        input[type="number"] {
            -moz-appearance: textfield !important;
            appearance: none !important;
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased flex flex-col">
    <!-- Top Navigation Bar -->
    <nav class="bg-[#2a2a32] border-b border-[#3f3f46] shadow-md sticky top-0 z-50">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                
                <!-- Left side: Brand -->
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <!-- Cloud Icon -->
                        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M5.5 16a3.5 3.5 0 01-.369-6.98 4 4 0 117.759-1.549V8a3.5 3.5 0 116.71 1.694A4.002 4.002 0 0115 16H5.5z" />
                        </svg>
                        <a href="/" class="text-lg font-semibold text-white tracking-wide">NZBoxer</a>
                        <span class="bg-[#3f3f46] text-[#a1a1aa] text-[10px] px-2 py-0.5 rounded-full font-mono mt-0.5">
                            v1.0.0
                        </span>
                    </div>
                </div>

                <!-- Right side: Navigation Links -->
                <div class="flex items-center gap-6 text-sm text-[#a1a1aa] font-medium">
                    <!-- Automation State -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.outside="open = false" class="flex items-center gap-2 px-3 py-1.5 bg-[#1e1e24] hover:bg-[#3f3f46] border border-[#3f3f46] rounded-md transition-colors text-xs font-medium">
                            <span class="flex h-2 w-2 relative">
                                {% if settings.automation_state == 'active' %}
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                                {% elif settings.automation_state == 'paused' %}
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-yellow-500"></span>
                                {% else %}
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                                {% endif %}
                            </span>
                            {{ settings.automation_state | title }}
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        
                        <div x-show="open" x-cloak class="absolute right-0 mt-2 w-48 bg-[#2a2a32] border border-[#3f3f46] rounded-md shadow-lg z-50 overflow-hidden">
                            <form hx-post="/api/automation/state" class="m-0 flex flex-col">
                                <button type="submit" name="state" value="active" class="text-left px-4 py-2 text-sm text-gray-300 hover:bg-[#3f3f46] hover:text-white flex items-center gap-2">
                                    <span class="inline-flex rounded-full h-2 w-2 bg-green-500"></span> Active
                                </button>
                                <button type="submit" name="state" value="paused" class="text-left px-4 py-2 text-sm text-gray-300 hover:bg-[#3f3f46] hover:text-white flex items-center gap-2">
                                    <span class="inline-flex rounded-full h-2 w-2 bg-yellow-500"></span> Paused
                                </button>
                                <button type="submit" name="state" value="disabled" class="text-left px-4 py-2 text-sm text-gray-300 hover:bg-[#3f3f46] hover:text-white flex items-center gap-2">
                                    <span class="inline-flex rounded-full h-2 w-2 bg-red-500"></span> Disabled
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 mr-4">
                        <button hx-post="/sync" hx-target="#sync-result" class="nav-link flex items-center gap-1.5 px-3 py-1.5 bg-[#3f3f46] hover:bg-[#52525b] text-white rounded-md transition-colors text-xs font-medium">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Simkl Sync
                        </button>
                        <button hx-post="/search" hx-target="#sync-result" class="nav-link flex items-center gap-1.5 px-3 py-1.5 bg-[#d40060] hover:bg-[#a3004a] text-white rounded-md transition-colors text-xs font-medium shadow-md shadow-pink-900/20">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            Start Search
                        </button>
                    </div>
                    
                    <a href="/" class="nav-link flex items-center gap-2">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                        Dashboard
                    </a>
                    
                    <a href="/settings" class="nav-link flex items-center gap-2">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>
                        Settings
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Global Alerts (Sync results etc) -->
    <div id="sync-result" class="max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 mt-4 empty:hidden"></div>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-4">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
