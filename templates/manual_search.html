{% extends "base.html" %}

{% block content %}
{% include "components/navbar.html" %}

<style>
    /* Prevent full page scroll, let the panels handle it */
    body { overflow: hidden; }
</style>

<div class="flex flex-col h-[calc(100vh-10rem)]">
    <div class="mb-4 border-b border-[#3f3f46] pb-3 shrink-0 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white tracking-wide">Manual Search</h1>
            <p class="text-sm text-[#a1a1aa] mt-1">Deep search across configured indexers with custom filtering.</p>
        </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-6 flex-1 min-h-0">
        <!-- Filter Panel -->
        <div class="w-full lg:w-[320px] shrink-0 h-full overflow-y-auto pb-6" style="scrollbar-width: none;">
        <form hx-post="/api/search/manual" hx-target="#search-results" hx-indicator="#search-loading" class="bg-[#2a2a32] border border-[#3f3f46] rounded-xl shadow-lg p-5 flex flex-col gap-4">
            
            <!-- Query -->
            <div>
                <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">Search Query</label>
                <input type="text" name="query" value="{{ defaults.get('query', '') }}" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060] transition-colors" placeholder="Movie or Series title...">
            </div>

            <!-- Series Details -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">Season</label>
                    <input type="number" name="season" min="1" value="{{ defaults.get('season', '') }}" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]" placeholder="e.g. 1">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">Episode</label>
                    <input type="text" name="episode" value="{{ defaults.get('episode', '') }}" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]" placeholder="e.g. 1 or 1-5">
                </div>
            </div>

            <!-- External IDs -->
            <div>
                <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">External IDs</label>
                <div class="flex flex-col gap-2">
                    <input type="text" name="imdb_id" value="{{ defaults.get('imdb_id', '') }}" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]" placeholder="IMDb ID (e.g. tt123456)">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" name="tmdb_id" value="{{ defaults.get('tmdb_id', '') }}" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]" placeholder="TMDb ID">
                        <input type="number" name="tvdb_id" value="{{ defaults.get('tvdb_id', '') }}" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]" placeholder="TVDb ID">
                    </div>
                </div>
            </div>

            
            <!-- Category & Language -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">Category</label>
                    <select name="category" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]">
                        <option value="any" {% if defaults.get('category') == 'any' %}selected{% endif %}>Any</option>
                        <option value="movie" {% if defaults.get('category') == 'movie' %}selected{% endif %}>Movie</option>
                        <option value="series" {% if defaults.get('category') == 'series' %}selected{% endif %}>Series</option>
                        <option value="anime" {% if defaults.get('category') == 'anime' %}selected{% endif %}>Anime</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">Language</label>
                    <select name="language" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]">
                        <option value="any" {% if defaults.get('language') == 'any' %}selected{% endif %}>Any (Default)</option>
                        <option value="german" {% if defaults.get('language') == 'german' %}selected{% endif %}>German</option>
                        <option value="english" {% if defaults.get('language') == 'english' %}selected{% endif %}>English</option>
                    </select>
                </div>
            </div>

            <hr class="border-[#3f3f46] my-2">

            <!-- Video Filters -->
            <div>
                <label class="block text-xs font-semibold text-white uppercase tracking-wider mb-2">Video Requirements</label>
                <div class="flex flex-col gap-3">
                    <select name="resolution" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]">
                        <option value="any" {% if defaults.get('resolution') == 'any' %}selected{% endif %}>Best Available (Any Res)</option>
                        <option value="2160p" {% if defaults.get('resolution') == '2160p' %}selected{% endif %}>2160p (4K)</option>
                        <option value="1080p" {% if defaults.get('resolution') == '1080p' %}selected{% endif %}>1080p</option>
                        <option value="720p" {% if defaults.get('resolution') == '720p' %}selected{% endif %}>720p</option>
                    </select>
                    
                    <select name="source" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]">
                        <option value="any" {% if defaults.get('source') == 'any' %}selected{% endif %}>Best Available (Any Source)</option>
                        <option value="remux" {% if defaults.get('source') == 'remux' %}selected{% endif %}>Remux Only</option>
                        <option value="bluray" {% if defaults.get('source') == 'bluray' %}selected{% endif %}>BluRay Only</option>
                        <option value="web" {% if defaults.get('source') == 'web' %}selected{% endif %}>WEB-DL / WEB Only</option>
                    </select>
                    
                    <select name="video_codec" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]">
                        <option value="any" {% if defaults.get('video_codec') == 'any' %}selected{% endif %}>Best Available (Any Codec)</option>
                        <option value="hevc" {% if defaults.get('video_codec') == 'hevc' %}selected{% endif %}>HEVC / H.265</option>
                        <option value="av1" {% if defaults.get('video_codec') == 'av1' %}selected{% endif %}>AV1</option>
                        <option value="h264" {% if defaults.get('video_codec') == 'h264' %}selected{% endif %}>H.264</option>
                    </select>

                    <select name="hdr" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]">
                        <option value="any" {% if defaults.get('hdr') == 'any' %}selected{% endif %}>Best Available (Any HDR)</option>
                        <option value="dolby vision" {% if defaults.get('hdr') == 'dolby vision' %}selected{% endif %}>Dolby Vision</option>
                        <option value="hdr10" {% if defaults.get('hdr') == 'hdr10' %}selected{% endif %}>HDR10 / HDR10+</option>
                        <option value="sdr" {% if defaults.get('hdr') == 'sdr' %}selected{% endif %}>SDR Only</option>
                    </select>
                </div>
            </div>

            <hr class="border-[#3f3f46] my-2">

            <!-- Audio Filters -->
            <div>
                <label class="block text-xs font-semibold text-white uppercase tracking-wider mb-2">Audio Requirements</label>
                <div class="flex flex-col gap-3">
                    <select name="audio_tier" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]">
                        <option value="any" {% if defaults.get('audio_tier') == 'any' %}selected{% endif %}>Best Available (Any Audio)</option>
                        <option value="tier1" {% if defaults.get('audio_tier') == 'tier1' %}selected{% endif %}>Tier 1 (TrueHD Atmos, DTS:X)</option>
                        <option value="tier2" {% if defaults.get('audio_tier') == 'tier2' %}selected{% endif %}>Tier 2 (DTS-HD MA, TrueHD)</option>
                        <option value="tier3" {% if defaults.get('audio_tier') == 'tier3' %}selected{% endif %}>Tier 3 (DD+ Atmos)</option>
                        <option value="tier4" {% if defaults.get('audio_tier') == 'tier4' %}selected{% endif %}>Tier 4 (EAC3, DTS, AC3)</option>
                    </select>
                    
                    <select name="audio_channels" class="w-full bg-[#1e1e24] border border-[#3f3f46] rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-[#d40060]">
                        <option value="any" {% if defaults.get('audio_channels') == 'any' %}selected{% endif %}>Any Channels</option>
                        <option value="7.1" {% if defaults.get('audio_channels') == '7.1' %}selected{% endif %}>7.1 Only</option>
                        <option value="5.1" {% if defaults.get('audio_channels') == '5.1' %}selected{% endif %}>5.1 Only</option>
                        <option value="2.0" {% if defaults.get('audio_channels') == '2.0' %}selected{% endif %}>2.0 Only</option>
                    </select>
                </div>
            </div>

            <hr class="border-[#3f3f46] my-2">

            <!-- Settings -->
            <div class="flex items-center justify-between">
                <div>
                    <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">Results</label>
                    <select name="limit" class="bg-[#1e1e24] border border-[#3f3f46] rounded-md px-2 py-1 text-white text-sm focus:outline-none focus:border-[#d40060]">
                        <option value="10" {% if defaults.get('limit') == 10 %}selected{% endif %}>10</option>
                        <option value="25" {% if defaults.get('limit') == 25 %}selected{% endif %}>25</option>
                        <option value="50" {% if defaults.get('limit') == 50 %}selected{% endif %}>50</option>
                    </select>
                </div>
                
                <label class="flex items-center gap-2 text-sm text-[#a1a1aa] cursor-pointer">
                    <input type="checkbox" name="save_defaults" value="true" class="rounded border-[#3f3f46] bg-[#1e1e24] text-[#d40060] focus:ring-[#d40060] focus:ring-offset-[#2a2a32]">
                    💾 Save as Default
                </label>
            </div>

            <!-- Submit -->
            <button type="submit" class="w-full mt-2 bg-[#d40060] hover:bg-[#a3004a] text-white font-medium py-2 px-4 rounded-md shadow-lg shadow-pink-900/20 transition-all flex items-center justify-center gap-2">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                Execute Search
            </button>
        </form>
    </div>

        <!-- Results Area -->
        <div class="flex-1 min-w-0 h-full overflow-y-auto pb-6 pr-2">
            <!-- Loading Indicator (hidden by default, shown by HTMX) -->
            <div id="search-loading" class="htmx-indicator flex flex-col items-center justify-center py-12">
                <svg class="animate-spin h-8 w-8 shrink-0 text-[#d40060] mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-[#a1a1aa] font-medium animate-pulse">Querying indexers and evaluating releases...</p>
            </div>

            <div id="search-results" class="flex flex-col gap-3">
                <div class="p-8 text-center border-2 border-dashed border-[#3f3f46] rounded-xl text-[#a1a1aa]">
                    <p>Set your filters and execute a search to see scored releases here.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
