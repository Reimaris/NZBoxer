{% set current_type = 'anime-movie' if item.media_type.value == 'movie' and item.is_anime_movie else 'series' if item.media_type.value == 'show' else item.media_type.value %}
<div x-data="{
    open: false,
    currentType: '{{ current_type }}',
    targetType: '',
    get isEpisodicToSingle() {
        const episodic = ['series', 'anime'];
        const single = ['movie', 'anime-movie'];
        return episodic.includes(this.currentType) && single.includes(this.targetType);
    },
    changeType(e) {
        this.targetType = e.target.value;
        if (this.targetType !== this.currentType) {
            this.open = true;
        }
    },
    cancel() {
        this.open = false;
        $refs.select.value = this.currentType;
    }
}">
    <div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1">Type</div>
    <select x-ref="select" @change="changeType" class="bg-slate-900 border border-slate-700 text-slate-300 text-sm rounded focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2 h-[38px] cursor-pointer appearance-none">
        <option value="movie" :selected="currentType === 'movie'">Movie</option>
        <option value="series" :selected="currentType === 'series'">Series</option>
        <option value="anime" :selected="currentType === 'anime'">Anime</option>
        <option value="anime-movie" :selected="currentType === 'anime-movie'">Anime Movie</option>
    </select>

    <!-- Modal -->
    <div x-show="open" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" style="display: none;" x-transition>
        <div @click.away="cancel()" class="bg-slate-900 border border-slate-700 rounded-xl p-6 max-w-md w-full shadow-2xl mx-4 transform transition-all">
            <h3 class="text-xl font-bold text-slate-100 mb-4">Confirm Type Change</h3>
            <p class="text-slate-300 text-sm mb-4">
                Are you sure you want to change the type from <span class="font-bold text-white capitalize" x-text="currentType.replace('-', ' ')"></span> to <span class="font-bold text-indigo-400 capitalize" x-text="targetType.replace('-', ' ')"></span>?
            </p>
            <template x-if="isEpisodicToSingle">
                <div class="bg-red-900/40 border border-red-700/50 rounded-lg p-3 mb-6">
                    <p class="text-red-400 text-sm font-semibold flex items-start gap-2">
                        <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        Warning: Converting from an Episodic type to a Single-Unit type will permanently delete all child season structures.
                    </p>
                </div>
            </template>
            <div class="flex justify-end gap-3 mt-6">
                <button @click="cancel()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-lg transition-colors border border-slate-600">Cancel</button>
                <form action="/api/items/{{ item.id }}/change-type" method="POST">
                    <input type="hidden" name="target_type" :value="targetType">
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-colors shadow-lg shadow-indigo-900/20">Confirm Change</button>
                </form>
            </div>
        </div>
    </div>
</div>
