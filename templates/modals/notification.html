<!-- Notification Modal -->
<div class="fixed inset-0 bg-black bg-opacity-70 z-[100] flex items-center justify-center p-4 animate-fade-in" id="notification-modal-overlay">
    <div class="bg-[#1e1e24] border border-[#3f3f46] rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
        <div class="bg-[#2a2a32] px-6 py-4 border-b border-[#3f3f46] flex justify-between items-center shrink-0">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                {% if notification %}Kanal bearbeiten{% else %}Neuen Kanal hinzufügen{% endif %}
            </h2>
            <button onclick="document.getElementById('modal-container').innerHTML = '';" class="text-[#a1a1aa] hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="p-6 overflow-y-auto">
            <form id="notification-form" hx-post="/settings/notification{% if notification %}/{{ notification.id }}{% endif %}" class="space-y-5">
                
                <div class="relative group">
                    <label class="block text-[#d1d5db] font-medium mb-1">
                        Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="name" value="{{ notification.name if notification else '' }}" required class="w-full bg-[#111115] border border-[#3f3f46] focus:border-[#d40060] rounded-lg p-2.5 text-white focus:outline-none transition-colors" placeholder="z.B. Mein Telegram Kanal">
                </div>

                <div class="relative group">
                    <label class="block text-[#d1d5db] font-medium mb-1 flex items-center gap-2">
                        Bot Token <span class="text-red-500">*</span>
                        <span class="text-[#d40060] cursor-help" title="Den Token erhalten Sie vom BotFather auf Telegram.">ℹ</span>
                    </label>
                    <input type="password" name="bot_token" value="{{ notification.bot_token if notification else '' }}" required class="w-full bg-[#111115] border border-[#3f3f46] focus:border-[#d40060] rounded-lg p-2.5 text-white focus:outline-none transition-colors font-mono" placeholder="123456789:ABCdefGHIjklMNOpqrSTUvwxYZ">
                </div>

                <div class="relative group">
                    <label class="block text-[#d1d5db] font-medium mb-1 flex items-center gap-2">
                        Chat ID <span class="text-red-500">*</span>
                        <span class="text-[#d40060] cursor-help" title="Die ID Ihres Chats oder Kanals.">ℹ</span>
                    </label>
                    <input type="text" name="chat_id" value="{{ notification.chat_id if notification else '' }}" required class="w-full bg-[#111115] border border-[#3f3f46] focus:border-[#d40060] rounded-lg p-2.5 text-white focus:outline-none transition-colors font-mono" placeholder="-1001234567890">
                </div>

            </form>
        </div>
        
        <div class="bg-[#2a2a32] px-6 py-4 border-t border-[#3f3f46] flex justify-end gap-3 shrink-0">
            <button type="button" onclick="document.getElementById('modal-container').innerHTML = '';" class="px-4 py-2 text-[#a1a1aa] hover:text-white font-medium transition-colors">Abbrechen</button>
            <button type="submit" form="notification-form" class="bg-[#d40060] hover:bg-[#a3004a] text-white px-6 py-2 rounded-lg font-bold transition-transform hover:scale-105 shadow-[0_0_10px_rgba(212,0,96,0.3)]">
                Speichern
            </button>
        </div>
    </div>
</div>
