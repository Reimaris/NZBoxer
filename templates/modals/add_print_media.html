<!-- Add Print Media Modal -->
<div class="fixed inset-0 bg-black bg-opacity-70 z-[100] flex items-center justify-center p-4 animate-fade-in" id="add-print-media-modal-overlay">
    <div class="bg-[#1e1e24] border border-[#3f3f46] rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]" @click.away="document.getElementById('modal-container').innerHTML = '';">
        
        <div class="bg-[#2a2a32] rounded-t-xl px-6 py-4 border-b border-[#3f3f46] flex justify-between items-center shrink-0">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 shrink-0 text-[#d40060]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Print Media
            </h2>
            <button onclick="document.getElementById('modal-container').innerHTML = '';" class="p-1.5 text-[#a1a1aa] hover:text-white hover:bg-[#3f3f46]/50 rounded-lg transition-colors focus:outline-none">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="p-6 overflow-y-auto" x-data="{ mediaType: 'manga' }">
            <form hx-post="/api/print/add" hx-target="#modal-container" class="space-y-6">
                
                <!-- Media Type Selector -->
                <div>
                    <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-2">Select Type</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" @click="mediaType = 'manga'" :class="mediaType === 'manga' ? 'bg-[#d40060] text-white border-[#d40060]' : 'bg-[#111115] text-[#a1a1aa] border-[#3f3f46] hover:text-white'" class="border rounded-lg py-2.5 px-4 font-medium text-sm flex items-center justify-center gap-2 transition-colors">
                            📖 Manga
                        </button>
                        <button type="button" @click="mediaType = 'book'" :class="mediaType === 'book' ? 'bg-[#d40060] text-white border-[#d40060]' : 'bg-[#111115] text-[#a1a1aa] border-[#3f3f46] hover:text-white'" class="border rounded-lg py-2.5 px-4 font-medium text-sm flex items-center justify-center gap-2 transition-colors">
                            📕 Book
                        </button>
                        <button type="button" @click="mediaType = 'magazine'" :class="mediaType === 'magazine' ? 'bg-[#d40060] text-white border-[#d40060]' : 'bg-[#111115] text-[#a1a1aa] border-[#3f3f46] hover:text-white'" class="border rounded-lg py-2.5 px-4 font-medium text-sm flex items-center justify-center gap-2 transition-colors">
                            📰 Magazine
                        </button>
                    </div>
                    <input type="hidden" name="media_type" :value="mediaType">
                </div>

                <!-- Title Input -->
                <div>
                    <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">Title <span class="text-red-500">*</span></label>
                    <input type="text" name="title" required class="w-full bg-[#111115] border border-[#3f3f46] focus:border-[#d40060] rounded-lg p-2.5 text-white focus:outline-none transition-colors" placeholder="e.g. Berserk, Project Hail Mary, Time Magazine...">
                </div>

                <!-- Manga specific inputs -->
                <div x-show="mediaType === 'manga'" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">AniList ID (Optional)</label>
                            <input type="text" name="anilist_id" class="w-full bg-[#111115] border border-[#3f3f46] focus:border-[#d40060] rounded-lg p-2.5 text-white focus:outline-none transition-colors" placeholder="e.g. 30002">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">Start Year</label>
                            <input type="number" name="start_year" class="w-full bg-[#111115] border border-[#3f3f46] focus:border-[#d40060] rounded-lg p-2.5 text-white focus:outline-none transition-colors" placeholder="e.g. 1989">
                        </div>
                    </div>
                </div>

                <!-- Book specific inputs -->
                <div x-show="mediaType === 'book'" class="space-y-4" style="display: none;">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">Author</label>
                            <input type="text" name="author" class="w-full bg-[#111115] border border-[#3f3f46] focus:border-[#d40060] rounded-lg p-2.5 text-white focus:outline-none transition-colors" placeholder="e.g. Andy Weir">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">ISBN</label>
                            <input type="text" name="isbn" class="w-full bg-[#111115] border border-[#3f3f46] focus:border-[#d40060] rounded-lg p-2.5 text-white focus:outline-none transition-colors" placeholder="e.g. 9780593135204">
                        </div>
                    </div>
                </div>

                <!-- Magazine specific inputs -->
                <div x-show="mediaType === 'magazine'" class="space-y-4" style="display: none;">
                    <div>
                        <label class="block text-xs font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">Publisher</label>
                        <input type="text" name="publisher" class="w-full bg-[#111115] border border-[#3f3f46] focus:border-[#d40060] rounded-lg p-2.5 text-white focus:outline-none transition-colors" placeholder="e.g. Time USA LLC">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex justify-end gap-3 pt-4 border-t border-[#3f3f46]">
                    <button type="button" onclick="document.getElementById('modal-container').innerHTML = '';" class="px-5 py-2.5 bg-[#3f3f46] hover:bg-[#52525b] text-white rounded-lg font-medium transition-colors text-sm">
                        Cancel
                    </button>
                    <button type="submit" class="px-6 py-2.5 bg-[#d40060] hover:bg-[#a3004a] text-white rounded-lg font-bold transition-colors text-sm flex items-center gap-2 shadow-lg">
                        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add to Library
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
