<!-- First-Run Setup Wizard (m54, ADR-128) -->
<div id="onboarding-modal"
     class="nzb-modal-backdrop fixed inset-0 z-[100] flex items-center justify-center p-2 sm:p-4 bg-black/80 backdrop-blur-sm animate-fade-in"
     x-data="{
         step: 1,
         error: '',
         saving: false,
         async post(url, formId) {
             const form = document.getElementById(formId);
             this.saving = true;
             this.error = '';
             try {
                 const resp = await fetch(url, { method: 'POST', body: new URLSearchParams(new FormData(form)) });
                 const data = await resp.json().catch(() => ({}));
                 if (resp.ok && data.ok) return data;
                 this.error = data.error || 'Could not save. Please try again.';
             } catch (e) {
                 this.error = 'Network error. Please try again.';
             } finally {
                 this.saving = false;
             }
             return null;
         },
         async saveStep1() {
             if (await this.post('/api/onboarding/step1', 'onboarding-step1-form')) this.step = this.step + 1;
         },
         async getSimklPin() {
             const data = await this.post('/api/onboarding/step1', 'onboarding-step1-form');
             if (!data) return;
             const form = document.getElementById('onboarding-step1-form');
             htmx.ajax('POST', '/simkl/auth/start', {
                 target: '#onboarding-simkl-pin',
                 swap: 'innerHTML',
                 values: { client_id: form.elements['simkl_client_id'].value, provider_id: data.provider_ids.simkl || '' }
             });
         },
         dismiss() {
             try { sessionStorage.setItem('nzb_onboarding_dismissed', '1'); } catch (e) {}
             const node = document.getElementById('onboarding-modal');
             if (node) node.remove();
         }
     }">
    <div class="nzb-modal-dialog nzb-modal-dialog-lg bg-[#1e1e24] border border-[#3f3f46] rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden text-[#d1d5db]"
         style="width: 100%; max-width: 48rem; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; background-color: #1e1e24; border: 1px solid #3f3f46; border-radius: 0.75rem;"
         @click.away="dismiss()">

        <div class="px-6 py-4 bg-[#2a2a32] border-b border-[#3f3f46] flex items-center justify-between">
            <div>
                <h3 class="text-lg font-bold text-white">Welcome to NZBoxer — Setup</h3>
                <div class="text-xs text-[#a1a1aa]" x-text="'Step ' + step + ' of 3'">Step 1 of 3</div>
            </div>
            <button type="button" @click="dismiss()" class="p-1.5 text-[#a1a1aa] hover:text-white hover:bg-[#3f3f46]/50 rounded-lg transition-colors" title="Close">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="p-6 space-y-4 overflow-y-auto flex-1">
            <div id="onboarding-error" x-show="error" x-cloak x-text="error" class="text-xs text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg px-3 py-2"></div>

            <div x-show="step === 1" id="onboarding-step-1" class="space-y-4">
                <form id="onboarding-step1-form" class="space-y-4" @submit.prevent="saveStep1()">
                <div class="bg-[#111115] border border-[#3f3f46] rounded-lg p-4 space-y-3">
                    <div class="flex items-center justify-between"><h4 class="text-sm font-bold text-white">Simkl</h4><a href="https://simkl.com/settings/developer/" target="_blank" rel="noopener noreferrer" class="text-[11px] text-[#d40060] hover:underline">Get API Key / Register ↗</a></div>
                    <label class="block text-xs text-[#a1a1aa]">Client ID
                        <input type="text" name="simkl_client_id" value="{{ simkl.client_id }}" autocomplete="off" placeholder="" class="mt-1 w-full bg-[#111115] border border-[#3f3f46] rounded-lg px-3 py-2 text-white text-xs focus:border-[#d40060] focus:outline-none"
                    </label>
                    <label class="block text-xs text-[#a1a1aa]">Username
                        <input type="text" name="simkl_username" value="{{ simkl.username }}" autocomplete="off" placeholder="" class="mt-1 w-full bg-[#111115] border border-[#3f3f46] rounded-lg px-3 py-2 text-white text-xs focus:border-[#d40060] focus:outline-none"
                    </label>
                    <button type="button" @click="getSimklPin()" :disabled="saving" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-colors disabled:opacity-50">Get PIN</button>
                    <div id="onboarding-simkl-pin">{% if simkl.connected %}<span class="text-xs text-green-400">✓ Connected</span>{% endif %}</div>
                </div>
                <div class="bg-[#111115] border border-[#3f3f46] rounded-lg p-4 space-y-3">
                    <div class="flex items-center justify-between"><h4 class="text-sm font-bold text-white">TMDB</h4><a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener noreferrer" class="text-[11px] text-[#d40060] hover:underline">Get API Key / Register ↗</a></div>
                    <label class="block text-xs text-[#a1a1aa]">API Key
                        <div class="relative mt-1" x-data="{ show: false }">
                            <input :type="show ? 'text' : 'password'" name="tmdb_api_key" value="{{ tmdb.api_key }}" autocomplete="off" placeholder="" class="w-full bg-[#111115] border border-[#3f3f46] rounded-lg px-3 py-2 text-white text-xs focus:border-[#d40060] focus:outline-none">
                            <button type="button" @click="show = !show" class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-[#a1a1aa] hover:text-white" x-text="show ? 'Hide' : 'Show'">Show</button>
                        </div>
                    </label>
                </div>
                <div class="bg-[#111115] border border-[#3f3f46] rounded-lg p-4 space-y-3">
                    <div class="flex items-center justify-between"><h4 class="text-sm font-bold text-white">TorBox</h4><a href="https://torbox.app/settings" target="_blank" rel="noopener noreferrer" class="text-[11px] text-[#d40060] hover:underline">Get API Key / Register ↗</a></div>
                    <label class="block text-xs text-[#a1a1aa]">API Key
                        <div class="relative mt-1" x-data="{ show: false }">
                            <input :type="show ? 'text' : 'password'" name="torbox_api_key" value="{{ torbox.api_key }}" autocomplete="off" placeholder="" class="w-full bg-[#111115] border border-[#3f3f46] rounded-lg px-3 py-2 text-white text-xs focus:border-[#d40060] focus:outline-none">
                            <button type="button" @click="show = !show" class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-[#a1a1aa] hover:text-white" x-text="show ? 'Hide' : 'Show'">Show</button>
                        </div>
                    </label>
                    <label class="block text-xs text-[#a1a1aa]">API Base URL
                        <input type="text" name="torbox_api_url" value="{{ torbox.api_url }}" autocomplete="off" placeholder="" class="mt-1 w-full bg-[#111115] border border-[#3f3f46] rounded-lg px-3 py-2 text-white text-xs focus:border-[#d40060] focus:outline-none"
                    </label>
                </div>
                <div class="bg-[#111115] border border-[#3f3f46] rounded-lg p-4 space-y-3">
                    <div class="flex items-center justify-between"><h4 class="text-sm font-bold text-white">Usenet Indexer</h4><a href="https://nzbgeek.info/" target="_blank" rel="noopener noreferrer" class="text-[11px] text-[#d40060] hover:underline">Get API Key / Register ↗</a></div>
                    <label class="block text-xs text-[#a1a1aa]">Name
                        <input type="text" name="indexer_name" value="{{ indexer.name }}" autocomplete="off" placeholder="e.g. NZBgeek" class="mt-1 w-full bg-[#111115] border border-[#3f3f46] rounded-lg px-3 py-2 text-white text-xs focus:border-[#d40060] focus:outline-none"
                    </label>
                    <label class="block text-xs text-[#a1a1aa]">API URL
                        <input type="text" name="indexer_url" value="{{ indexer.api_url }}" autocomplete="off" placeholder="" class="mt-1 w-full bg-[#111115] border border-[#3f3f46] rounded-lg px-3 py-2 text-white text-xs focus:border-[#d40060] focus:outline-none"
                    </label>
                    <label class="block text-xs text-[#a1a1aa]">API Key
                        <div class="relative mt-1" x-data="{ show: false }">
                            <input :type="show ? 'text' : 'password'" name="indexer_api_key" value="{{ indexer.api_key }}" autocomplete="off" placeholder="" class="w-full bg-[#111115] border border-[#3f3f46] rounded-lg px-3 py-2 text-white text-xs focus:border-[#d40060] focus:outline-none">
                            <button type="button" @click="show = !show" class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-[#a1a1aa] hover:text-white" x-text="show ? 'Hide' : 'Show'">Show</button>
                        </div>
                    </label>
                </div>
                </form>
            </div>
            <div x-show="step === 2" x-cloak id="onboarding-step-2" class="space-y-4">
                <!-- Step 2: Notifications, optional (ticket 06) -->
            </div>
            <div x-show="step === 3" x-cloak id="onboarding-step-3" class="space-y-4">
                <!-- Step 3: Verification & First Sync (ticket 07) -->
                <div id="onboarding-check-results"></div>
                <div id="onboarding-sync-result"></div>
            </div>
        </div>

        <div class="px-6 py-4 bg-[#2a2a32] border-t border-[#3f3f46] flex flex-col sm:flex-row gap-2 sm:items-center">
            <div class="flex gap-3 sm:mr-auto text-xs">
                <button type="button" @click="dismiss()" class="text-[#a1a1aa] hover:text-white underline-offset-2 hover:underline">Skip for now</button>
                <button type="button" hx-post="/api/onboarding/complete" hx-target="#modal-container" hx-swap="innerHTML"
                        class="text-[#a1a1aa] hover:text-white underline-offset-2 hover:underline">Skip Setup</button>
            </div>
            <button type="button" x-show="step > 1" @click="step = step - 1; error = ''"
                    class="w-full sm:w-auto bg-[#2a2a32] hover:bg-[#3f3f46] border border-[#3f3f46] text-white px-4 py-2 rounded-lg text-xs font-bold transition-colors">Back</button>
            <button type="button" x-show="step === 1" @click="saveStep1()" :disabled="saving"
                    class="w-full sm:w-auto bg-[#d40060] hover:bg-[#a3004a] text-white px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-lg shadow-[#d40060]/20 disabled:opacity-50">Save &amp; Next</button>
            <button type="button" x-show="step < 3" @click="step = step + 1; error = ''"
                    class="w-full sm:w-auto bg-[#2a2a32] hover:bg-[#3f3f46] border border-[#3f3f46] text-white px-4 py-2 rounded-lg text-xs font-bold transition-colors">Skip this Step</button>
            <button type="button" x-show="step === 2" x-cloak hx-post="/api/onboarding/complete" hx-target="#modal-container" hx-swap="innerHTML"
                    class="w-full sm:w-auto bg-[#2a2a32] hover:bg-[#3f3f46] border border-[#3f3f46] text-white px-4 py-2 rounded-lg text-xs font-bold transition-colors">Finish Later</button>
            <button type="button" x-show="step === 3" x-cloak hx-post="/api/onboarding/complete" hx-target="#modal-container" hx-swap="innerHTML"
                    class="w-full sm:w-auto bg-[#d40060] hover:bg-[#a3004a] text-white px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-lg shadow-[#d40060]/20">Finish Setup</button>
        </div>
    </div>
</div>
