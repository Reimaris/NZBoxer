<div id="system-check-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
    <div class="bg-[#1e1e24] border border-[#3f3f46] rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col" @click.away="document.getElementById('system-check-modal').remove()">
        
        <div class="flex items-center justify-between p-4 border-b border-[#3f3f46] bg-[#2a2a32]">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                System Check
            </h2>
            <button onclick="document.getElementById('system-check-modal').remove()" class="text-[#a1a1aa] hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="p-6">
            <p class="text-sm text-[#a1a1aa] mb-6">
                Teste die Verbindung zu allen angebundenen Systemen...
            </p>
            
            <div id="system-check-results" hx-get="/system/check/run" hx-trigger="load" class="min-h-[200px] flex items-center justify-center">
                <div class="flex flex-col items-center justify-center text-[#a1a1aa]">
                    <svg class="w-8 h-8 animate-spin mb-4 text-[#d40060]" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Lade Testergebnisse...</span>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end">
                <button onclick="document.getElementById('system-check-modal').remove()" class="bg-[#3f3f46] hover:bg-[#52525b] text-white px-6 py-2 rounded-lg font-medium transition-colors">
                    Schließen
                </button>
            </div>
        </div>
        
    </div>
</div>
