<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 512 512"
   width="100%"
   height="100%"
   version="1.1"
   id="svg6"
   sodipodi:docname="NZBoxer.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview6"
     pagecolor="#505050"
     bordercolor="#ffffff"
     borderopacity="1"
     inkscape:showpageshadow="0"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="1"
     inkscape:deskcolor="#505050"
     inkscape:zoom="1.8261719"
     inkscape:cx="256.27379"
     inkscape:cy="256"
     inkscape:window-width="1920"
     inkscape:window-height="1056"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="nzboxer-symbol" />
  <defs
     id="defs5">
    <!-- Weicher Glanzverlauf für den pinken Kern -->
    <radialGradient
       id="pinkGrad"
       cx="45%"
       cy="40%"
       r="60%">
      <stop
         offset="0%"
         stop-color="#ff4088"
         id="stop1" />
      <stop
         offset="65%"
         stop-color="#e91e63"
         id="stop2" />
      <stop
         offset="100%"
         stop-color="#b8004f"
         id="stop3" />
    </radialGradient>
    <!-- Dunkler Hintergrundverlauf -->
    <linearGradient
       id="bgGrad"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#242426"
         id="stop4" />
      <stop
         offset="100%"
         stop-color="#141416"
         id="stop5" />
    </linearGradient>
    <filter
       id="drop-shadow"
       x="-0.11842105"
       y="-0.069230769"
       width="1.2368421"
       height="1.1384584">
      <feDropShadow
         dx="0"
         dy="14"
         stdDeviation="16"
         flood-color="#000000"
         flood-opacity="0.45" />
    </filter>
    <linearGradient
       id="tealGrad"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0%"
         stop-color="#00e5a3"
         id="stop3-3" />
      <stop
         offset="100%"
         stop-color="#00966d"
         id="stop4-6" />
    </linearGradient>
    <linearGradient
       id="magentaGrad"
       x1="94.218917"
       y1="206.84105"
       x2="94.218917"
       y2="466.8189"
       gradientTransform="scale(1.1417978,0.87581185)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#ea1889"
         id="stop5-3" />
      <stop
         offset="100%"
         stop-color="#bd0d6b"
         id="stop6" />
    </linearGradient>
    <filter
       id="filter6"
       x="-0.11842105"
       y="-0.069230773"
       width="1.2368422"
       height="1.1384584">
      <feDropShadow
         dx="0"
         dy="14"
         stdDeviation="16"
         flood-color="#000000"
         flood-opacity="0.45" />
    </filter>
    <filter
       id="filter7"
       x="-0.11842105"
       y="-0.069230773"
       width="1.2368422"
       height="1.1384584">
      <feDropShadow
         dx="0"
         dy="14"
         stdDeviation="16"
         flood-color="#000000"
         flood-opacity="0.45" />
    </filter>
    <linearGradient
       inkscape:collect="always"
       xlink:href="#tealGrad"
       id="linearGradient7"
       x1="83.111423"
       y1="187.93897"
       x2="83.111423"
       y2="292.80346"
       gradientTransform="scale(1.3618766,0.73428093)"
       gradientUnits="userSpaceOnUse" />
    <linearGradient
       inkscape:collect="always"
       xlink:href="#tealGrad"
       id="linearGradient8"
       x1="187.97592"
       y1="187.93897"
       x2="187.97592"
       y2="292.80346"
       gradientTransform="scale(1.3618766,0.73428093)"
       gradientUnits="userSpaceOnUse" />
  </defs>
  <!-- Hintergrund-Squircle -->
  <rect
     x="24"
     y="24"
     width="464"
     height="464"
     rx="105"
     fill="url(#bgGrad)"
     stroke="#3a3a3d"
     stroke-width="3"
     id="rect5" />
  <!-- Äußerer türquiser Bogen (~280 Grad, abgerundete Enden) -->
  <!-- Startet oben bei ca. -75° und läuft im Uhrzeigersinn bis ca. 45° -->
  <!-- Mittlerer oranger gestrichelter Kreis -->
  <!-- Zentrierter pinker Ring (Donut) -->
  <g
     id="nzboxer-symbol"
     transform="translate(-8.5122883e-6,18.32724)">
    <!-- HINTERGRUND-ELEMENTE: Offene Box-Flügel (Türkis) -->
    <g
       filter="url(#drop-shadow)"
       id="g5">
      <!-- Linker Flügel -->
      <path
         d="m 160,215 -45,-60 c -5,-7 1,-17 10,-17 h 95 c 8,0 15,5 18,12 l 18,45 z"
         fill="url(#tealGrad)"
         opacity="0.9"
         id="path4"
         style="fill:url(#linearGradient7)" />
      <!-- Rechter Flügel -->
      <path
         d="m 352,215 45,-60 c 5,-7 -1,-17 -10,-17 h -95 c -8,0 -15,5 -18,12 l -18,45 z"
         fill="url(#tealGrad)"
         opacity="0.9"
         id="path5"
         style="fill:url(#linearGradient8)" />
    </g>
    <!-- DYNAMIK: Gestrichelte Download-Spur (Orange / Cyan) -->
    <path
       d="m 200,95 v 60"
       stroke="#00e5a3"
       stroke-width="5"
       stroke-linecap="round"
       stroke-dasharray="8, 12"
       opacity="0.6"
       id="path7" />
    <path
       d="m 312,95 v 60"
       stroke="#00e5a3"
       stroke-width="5"
       stroke-linecap="round"
       stroke-dasharray="8, 12"
       opacity="0.6"
       id="path8" />
    <!-- VORDERGRUND: Hauptkörper der Box (Magenta) -->
    <rect
       x="136"
       y="195"
       width="240"
       height="200"
       rx="36"
       fill="url(#magentaGrad)"
       filter="url(#drop-shadow)"
       id="rect8"
       style="fill:url(#magentaGrad)" />
    <!-- BOX-FRONT DETAILS: Typischer Paketverschluss-Ausschnitt -->
    <path
       d="m 226,195 c 0,16 13,29 30,29 17,0 30,-13 30,-29 z"
       fill="#1c2128"
       opacity="0.35"
       id="path9" />
    <!-- AKZENT: Download-Pfeil (Orange) mit Schlagschatten -->
    <g
       filter="url(#drop-shadow)"
       id="g10"
       style="display:inline"
       transform="translate(6.2473118e-6,24.094117)">
      <!-- Pfeilschaft -->
      <line
         x1="256"
         y1="165"
         x2="256"
         y2="280"
         stroke="#f59e0b"
         stroke-width="18"
         stroke-linecap="round"
         id="line9" />
      <!-- Pfeilspitze -->
      <path
         d="m 218,255 38,40 38,-40"
         fill="none"
         stroke="#f59e0b"
         stroke-width="18"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path10" />
    </g>
    <!-- SUBTILER AKZENT-STREIFEN: Horizontaler Balken (wie im ersten Icon) -->
    <rect
       x="176"
       y="340"
       width="160"
       height="12"
       rx="6"
       fill="#00e5a3"
       opacity="0.4"
       id="rect10" />
    <rect
       x="216"
       y="364"
       width="80"
       height="8"
       rx="4"
       fill="#ffffff"
       opacity="0.2"
       id="rect11" />
  </g>
