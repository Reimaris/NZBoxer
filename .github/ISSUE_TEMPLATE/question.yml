name: Question
description: Ask a question about using Smewlet
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: Check the README first. Diagnostics are optional but help us answer faster.
  - type: input
    id: question_summary
    attributes:
      label: Question summary
    validations:
      required: true
  - type: textarea
    id: context_details
    attributes:
      label: Context & details
    validations:
      required: true
  - type: textarea
    id: troubleshooting
    attributes:
      label: Troubleshooting attempted
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Environment Diagnostics
      description: Paste the table copied from Smewlet (Settings → Ask a Question → Copy Diagnostics Table).
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I checked the README and docs
          required: true
        - label: I checked existing issues
          required: true
